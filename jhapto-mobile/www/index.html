<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jhapto</title>
  <style>
    :root { --bg: #edebe8; --card: #fff; --text: #1a1a1a; --muted: #6b6b6b; --accent: #ff6a3d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1c1c1c; --text: #f2f2f2; --muted: #a0a0a0; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Roboto, sans-serif; }
    .card { background: var(--card); border-radius: 24px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; }
    .logo { font-size: 2rem; font-weight: 800; letter-spacing: -0.06em; margin: 0 0 16px; color: var(--text); }
    .logo span { color: var(--accent); }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    button { width: 100%; border: 0; border-radius: 999px; padding: 14px; font-size: 1rem; font-weight: 600;
      background: var(--accent); color: #fff; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main class="card">
    <p class="logo">jhapto<span>.</span></p>
    <h1>You're offline</h1>
    <p>Jhapto needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.href = 'https://jhapto.vercel.app'">Try again</button>
  </main>
</body>
</html>
